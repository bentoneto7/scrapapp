<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - NLE 2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-container{width:90%;max-width:400px}
.login-box{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:2.5rem 2rem;text-align:center}
.logo{font-size:2rem;margin-bottom:.3rem;background:linear-gradient(135deg,#ffd740,#ff6d00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.sub{color:#8b949e;font-size:.9rem;margin-bottom:2rem}
.form-group{margin-bottom:1.2rem;text-align:left}
.form-group label{display:block;font-size:.82rem;color:#8b949e;margin-bottom:.4rem;font-weight:500}
.form-group input{width:100%;padding:.7rem .9rem;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:.95rem;outline:none;transition:border .2s}
.form-group input:focus{border-color:#ffd740}
.form-group input::placeholder{color:#484f58}
.btn-login{width:100%;padding:.8rem;background:linear-gradient(135deg,#ffd740,#ff6d00);border:none;border-radius:8px;color:#000;font-weight:700;font-size:1rem;cursor:pointer;transition:opacity .2s;margin-top:.5rem}
.btn-login:hover{opacity:.9}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.error-msg{background:#f8514920;border:1px solid #f85149;color:#f85149;padding:.5rem .8rem;border-radius:6px;font-size:.82rem;margin-bottom:1rem;display:none}
.info-box{margin-top:1.5rem;background:#1c2333;border:1px solid #30363d;border-radius:8px;padding:.8rem;font-size:.78rem;color:#8b949e;line-height:1.5}
.info-box strong{color:#ffd740}
.show-pass{display:flex;align-items:center;gap:.4rem;margin-top:.4rem;cursor:pointer;font-size:.78rem;color:#8b949e;user-select:none}
.show-pass input{width:auto;margin:0}
.forgot-link{text-align:center;margin-top:1.2rem;font-size:.85rem}
.forgot-link a{color:#58a6ff;text-decoration:none;cursor:pointer}
.forgot-link a:hover{text-decoration:underline}
.forgot-box{margin-top:1.2rem;background:#1c2333;border:1px solid #30363d;border-radius:8px;padding:1.2rem}
.forgot-text{font-size:.82rem;color:#8b949e;margin-bottom:1rem;line-height:1.5}
.forgot-error{background:#f8514920;border:1px solid #f85149;color:#f85149;padding:.5rem .8rem;border-radius:6px;font-size:.82rem;margin-top:.8rem}
.forgot-success{background:#2ea04320;border:1px solid #2ea043;color:#2ea043;padding:.5rem .8rem;border-radius:6px;font-size:.82rem;margin-top:.8rem}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-box">
    <div class="logo">Nome Limpo Express</div>
    <p class="sub">Acesse sua conta</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Login</label>
        <input type="text" id="loginInput" placeholder="Seu login" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="senhaInput" placeholder="Sua senha" autocomplete="current-password" required>
        <label class="show-pass">
          <input type="checkbox" id="showPass"> Mostrar senha
        </label>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
    </form>

    <div class="forgot-link">
      <a href="#" id="forgotPassLink">Esqueci minha senha</a>
    </div>

    <!-- Forgot Password Modal -->
    <div class="forgot-box" id="forgotBox" style="display:none;">
      <p class="forgot-text">Informe seu login e e-mail cadastrado para redefinir a senha:</p>
      <div class="form-group">
        <label>Login</label>
        <input type="text" id="forgotLogin" placeholder="Seu login">
      </div>
      <div class="form-group">
        <label>E-mail cadastrado</label>
        <input type="email" id="forgotEmail" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Nova Senha</label>
        <input type="password" id="forgotSenha" placeholder="Minimo 6 caracteres">
      </div>
      <div class="form-group">
        <label>Confirmar Nova Senha</label>
        <input type="password" id="forgotSenha2" placeholder="Repita a nova senha">
      </div>
      <button type="button" class="btn-login" id="btnResetPass">Redefinir Senha</button>
      <div class="forgot-error" id="forgotError" style="display:none;"></div>
      <div class="forgot-success" id="forgotSuccess" style="display:none;"></div>
      <div class="forgot-link" style="margin-top:.8rem;">
        <a href="#" id="backToLogin">Voltar ao login</a>
      </div>
    </div>
  </div>
</div>

<script src="/shared/auth.js"></script>
<script>
// If already logged in, redirect
if (NLE_AUTH.isLoggedIn()) {
  window.location.href = '/';
}

const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const showPass = document.getElementById('showPass');
const senhaInput = document.getElementById('senhaInput');

showPass.addEventListener('change', () => {
  senhaInput.type = showPass.checked ? 'text' : 'password';
});

// Forgot password toggle
const forgotLink = document.getElementById('forgotPassLink');
const forgotBox = document.getElementById('forgotBox');
const backToLogin = document.getElementById('backToLogin');
const btnReset = document.getElementById('btnResetPass');
const forgotError = document.getElementById('forgotError');
const forgotSuccess = document.getElementById('forgotSuccess');

forgotLink.addEventListener('click', (e) => {
  e.preventDefault();
  form.style.display = 'none';
  document.querySelector('.forgot-link').style.display = 'none';
  forgotBox.style.display = 'block';
  document.querySelector('.sub').textContent = 'Redefinir senha';
});

backToLogin.addEventListener('click', (e) => {
  e.preventDefault();
  form.style.display = 'block';
  document.querySelector('.forgot-link').style.display = 'block';
  forgotBox.style.display = 'none';
  document.querySelector('.sub').textContent = 'Acesse sua conta';
  forgotError.style.display = 'none';
  forgotSuccess.style.display = 'none';
});

btnReset.addEventListener('click', () => {
  forgotError.style.display = 'none';
  forgotSuccess.style.display = 'none';

  const login = document.getElementById('forgotLogin').value.trim().toLowerCase();
  const email = document.getElementById('forgotEmail').value.trim().toLowerCase();
  const novaSenha = document.getElementById('forgotSenha').value;
  const novaSenha2 = document.getElementById('forgotSenha2').value;

  if (!login || !email || !novaSenha || !novaSenha2) {
    forgotError.textContent = 'Preencha todos os campos.';
    forgotError.style.display = 'block';
    return;
  }
  if (novaSenha.length < 6) {
    forgotError.textContent = 'A nova senha deve ter no minimo 6 caracteres.';
    forgotError.style.display = 'block';
    return;
  }
  if (novaSenha !== novaSenha2) {
    forgotError.textContent = 'As senhas nao conferem.';
    forgotError.style.display = 'block';
    return;
  }

  // Find user by login + email
  const users = NLE_AUTH.getUsers();
  const user = users.find(u => u.login === login && u.email === email);
  if (!user) {
    forgotError.textContent = 'Login e e-mail nao correspondem a nenhuma conta.';
    forgotError.style.display = 'block';
    return;
  }

  // Update password
  const result = NLE_AUTH.updateUser(user.id, { senha: novaSenha });
  if (result.ok) {
    forgotSuccess.textContent = 'Senha redefinida com sucesso! Volte ao login para acessar.';
    forgotSuccess.style.display = 'block';
    document.getElementById('forgotLogin').value = '';
    document.getElementById('forgotEmail').value = '';
    document.getElementById('forgotSenha').value = '';
    document.getElementById('forgotSenha2').value = '';
  } else {
    forgotError.textContent = 'Erro ao redefinir senha. Tente novamente.';
    forgotError.style.display = 'block';
  }
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  errorMsg.style.display = 'none';

  const login = document.getElementById('loginInput').value;
  const senha = senhaInput.value;

  if (!login || !senha) {
    errorMsg.textContent = 'Preencha todos os campos';
    errorMsg.style.display = 'block';
    return;
  }

  const result = NLE_AUTH.login(login, senha);
  if (result.ok) {
    window.location.href = '/';
  } else {
    errorMsg.textContent = result.msg;
    errorMsg.style.display = 'block';
    senhaInput.value = '';
    senhaInput.focus();
  }
});
</script>
</body>
</html>
