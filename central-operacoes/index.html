<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NLE - Central de Operacoes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{display:flex;min-height:100vh;background:#f0f2f5;color:#333}
:root{--sidebar-bg:#1a237e;--sidebar-w:220px;--green:#2e7d32;--green-light:#43a047;--card-shadow:0 2px 8px rgba(0,0,0,.1);--radius:8px}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .3s}
.sidebar .logo{padding:20px 16px;font-size:1.1rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.15);text-align:center;letter-spacing:.5px}
.sidebar .logo small{display:block;font-weight:400;font-size:.7rem;opacity:.7;margin-top:2px}
.sidebar nav{flex:1;overflow-y:auto;padding:8px 0}
.sidebar nav button{display:flex;align-items:center;gap:10px;width:100%;padding:13px 18px;background:none;border:none;color:rgba(255,255,255,.75);font-size:.9rem;cursor:pointer;text-align:left;transition:all .2s}
.sidebar nav button:hover,.sidebar nav button.active{background:rgba(255,255,255,.12);color:#fff}
.sidebar nav button .icon{font-size:1.15rem;width:24px;text-align:center}
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--sidebar-bg);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:1.3rem;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}
.main{margin-left:var(--sidebar-w);flex:1;padding:24px;min-height:100vh;width:calc(100% - var(--sidebar-w))}
.page{display:none}
.page.active{display:block}
h2{font-size:1.4rem;margin-bottom:18px;color:#1a237e}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-light)}
.btn-secondary{background:#e0e0e0;color:#333}
.btn-secondary:hover{background:#bdbdbd}
.btn-danger{background:#c62828;color:#fff}
.btn-danger:hover{background:#e53935}
.btn-sm{padding:6px 12px;font-size:.8rem}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);padding:18px;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px;color:#555}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:6px;font-size:.88rem;transition:border .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--green)}
.form-group textarea{resize:vertical;min-height:80px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:600;color:#fff}
.progress-bar{background:#e0e0e0;border-radius:10px;height:10px;overflow:hidden;margin:6px 0}
.progress-bar .fill{height:100%;background:var(--green);border-radius:10px;transition:width .4s}
.stats-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.stat-card{flex:1;min-width:120px;background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);padding:14px;text-align:center}
.stat-card .val{font-size:1.6rem;font-weight:700;color:var(--green)}
.stat-card .lbl{font-size:.72rem;color:#888;margin-top:2px}
.tabs{display:flex;gap:0;border-bottom:2px solid #e0e0e0;margin-bottom:14px}
.tabs button{padding:8px 16px;border:none;background:none;font-size:.82rem;cursor:pointer;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-weight:600}
.tabs button.active{color:var(--green);border-bottom-color:var(--green)}
.tab-content{display:none}
.tab-content.active{display:block}
.mission-card{border-left:4px solid #ccc;padding-left:14px}
.mission-card.done{opacity:.65;border-left-color:var(--green)}
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;margin-right:4px;color:#fff}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #eee}
.list-item:last-child{border-bottom:none}
.color-dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding:10px 0}
.bar-chart .bar{flex:1;background:var(--green);border-radius:4px 4px 0 0;min-width:20px;position:relative;transition:height .3s}
.bar-chart .bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.6rem;color:#888;white-space:nowrap}
.toast{position:fixed;bottom:24px;right:24px;background:#333;color:#fff;padding:12px 20px;border-radius:var(--radius);font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.script-box{background:#f5f5f5;border-radius:6px;padding:14px;font-size:.85rem;line-height:1.6;white-space:pre-wrap;margin-bottom:10px;border:1px solid #e0e0e0}
.dna-box{background:#e8eaf6;border-radius:6px;padding:10px;font-size:.75rem;color:#555;margin-top:10px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:85vh;overflow-y:auto}
.modal h3{margin-bottom:16px}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:block}
  .overlay.show{display:block}
  .main{margin-left:0;width:100%;padding:16px;padding-top:56px}
  .grid-2{grid-template-columns:1fr}
  .stats-row{gap:8px}
  .stat-card{min-width:80px;padding:10px}
}
</style>
</head>

<script>
/* ==================== UTILITIES ==================== */
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function uid(){return Date.now().toString(36)+'_'+Math.random().toString(36).substr(2,6);}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function copyText(txt){navigator.clipboard.writeText(txt).then(function(){toast('Copiado!');}).catch(function(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Copiado!');});}

/* ==================== STORAGE ==================== */
function load(key,def){try{var d=localStorage.getItem(key);return d?JSON.parse(d):def;}catch(e){return def;}}
function save(key,data){localStorage.setItem(key,JSON.stringify(data));}

var perfis=load('nle_pf',[]);
var grupos=load('nle_gr',[]);
var missoes=load('nle_ms',[]);
var dist=load('nle_dist',[]);
var config=load('nle_cfg',{whatsapp:'5511999999999',wave:1,day:1});

    custo:['Ja calculou quanto o nome sujo te custa por mes?','O imposto invisivel de estar negativado:','A conta que ninguem faz:','Cada dia negativado custa dinheiro. Quanto?','A matematica cruel de estar com nome sujo:'],

    comentario:['Isso tem solucao legal.','Muita gente nao sabe, mas:','Pela minha experiencia:','So pra complementar:','Boa pergunta. O que eu sei e:']
  },
  bodies:['O Codigo de Defesa do Consumidor (art. 43) exige que voce seja NOTIFICADO antes de qualquer negativacao. Se nao foi, a inclusao pode ser irregular.','Nenhuma negativacao pode permanecer nos orgaos de protecao por mais de 5 anos. Se a sua tem mais que isso, ela esta la de forma ilegal.','A LGPD (art. 18) te da direito de corrigir dados incorretos em qualquer cadastro financeiro, incluindo Serasa, SPC e Boa Vista.','A Sumula 548 do STJ e clara: se voce pagou e o credor nao retirou em 5 dias, cabe indenizacao por dano moral.','Dever nao anula seus direitos. O credor tem obrigacoes legais no processo de negativacao. Quando nao cumpre, o consumidor pode contestar.','Muita gente confunde renegociar com limpar nome. Sao coisas diferentes. Limpar e verificar se a negativacao seguiu a lei.','Os bancos classificam voce internamente de AA a H. Nome limpo no Serasa NAO garante bom rating bancario.','O SCR do Banco Central registra TODAS as operacoes de credito. E la que os bancos realmente olham antes de aprovar.','A prescricao da divida (5 anos, art. 206 CC) impede cobranca judicial. Mas a negativacao tem prazo proprio no art. 43 CDC.','Consulte o Registrato (registrato.bcb.gov.br) gratuitamente. La voce ve tudo vinculado ao seu CPF no sistema financeiro.','Negativacao sem notificacao previa e irregular. E a base de milhares de decisoes judiciais favoraveis ao consumidor.','Pra MEI e empreendedores: o banco olha o CPF do titular, nao o CNPJ. Regularizar o CPF e investir no negocio.'],

function genContent(type,allowLink,wave){
  var opening=pick(CE.openings[type]);
  var bodyShuffle=shuffle(CE.bodies);
  var b1=bodyShuffle[0],b2=bodyShuffle[1];
  var closing=pick(CE.closings);
  var connector=pick(CE.connectors);
  var cta='';
  if(wave>=4){cta=allowLink==='sim'?pick(CE.ctaComLink):pick(CE.ctaSemLink);}
  else if(wave>=2&&type!=='comentario'){cta=pick(CE.ctaSemLink);}
  var dna={type:type,wave:wave,allowLink:allowLink,openingIdx:CE.openings[type].indexOf(opening),body1Idx:CE.bodies.indexOf(b1),body2Idx:CE.bodies.indexOf(b2),closingIdx:CE.closings.indexOf(closing)};
  var text=opening+'\n\n'+b1+connector+b2+'\n\n'+closing+(cta?'\n\n'+cta:'');
  return{text:text,dna:dna};
}

  apresentacao:{

function buildSidebar(){
  var nav=document.getElementById('sideNav');
  var html='';
  pages.forEach(function(p){
    html+='<button data-page="'+p.id+'" onclick="goTo(\''+p.id+'\')">';
    html+='<span class="icon">'+p.icon+'</span><span>'+p.label+'</span></button>';
  });
  nav.innerHTML=html;
}

function goTo(id){
  document.querySelectorAll('.page').forEach(function(el){el.classList.remove('active');});
  document.getElementById('pg-'+id).classList.add('active');
  document.querySelectorAll('#sideNav button').forEach(function(b){
    b.classList.toggle('active',b.dataset.page===id);
  });
  if(window.innerWidth<=768){var sb=document.getElementById('sidebar');sb.classList.remove('open');document.getElementById('overlay').classList.remove('show');}
  if(id==='missoes')renderMissoes();
  if(id==='perfis')renderPerfis();
  if(id==='grupos')renderGrupos();
  if(id==='scripts')renderScripts();
  if(id==='config')renderConfig();
  if(id==='metricas')renderMetricas();
}

function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}

/* ==================== DISTRIBUTION ALGORITHM ==================== */
function distribuirGrupos(){
  dist=[];
  if(!perfis.length||!grupos.length)return dist;
  var shuffled=shuffle(grupos);
  var assignments={};
  perfis.forEach(function(p){assignments[p.id]=0;});
  var profileQueue=perfis.slice();
  var pi=0;
  shuffled.forEach(function(g){
    var attempts=0;
    while(attempts<profileQueue.length){
      var profile=profileQueue[pi%profileQueue.length];
      if(assignments[profile.id]<profile.maxGrupos){
        dist.push({perfilId:profile.id,grupoId:g.id});
        assignments[profile.id]++;
        pi++;
        break;
      }
      pi++;
      attempts++;
    }
  });
  save('nle_dist',dist);
  return dist;
}

/* ==================== MISSOES ==================== */
function gerarMissoes(){
  if(!perfis.length){toast('Cadastre pelo menos 1 perfil primeiro');return;}
  if(!grupos.length){toast('Cadastre pelo menos 1 grupo primeiro');return;}
  distribuirGrupos();
  var wave=config.wave||1;
  missoes=[];
  dist.forEach(function(d){
    var grupo=grupos.find(function(g){return g.id===d.grupoId;});
    var tipo=pick(['educativo','mito','pergunta','custo','historia','conversao']);
    var allowLink=grupo?grupo.permiteLinks:'sim';
    var result=genContent(tipo,allowLink,wave);
    missoes.push({
      id:uid(),
      perfilId:d.perfilId,
      grupoId:d.grupoId,
      tipo:tipo,
      conteudo:result.text,
      dna:result.dna,
      done:false,
      createdAt:new Date().toISOString()
    });
  });
  save('nle_ms',missoes);
  renderMissoes();
  toast(missoes.length+' missoes geradas!');
}

function renderMissoes(){
  var total=missoes.length;
  var done=missoes.filter(function(m){return m.done;}).length;
  var pending=total-done;
  var activePerfis=[];
  var activeGrupos=[];
  var reach=0;
  missoes.forEach(function(m){
    if(activePerfis.indexOf(m.perfilId)===-1)activePerfis.push(m.perfilId);
    if(activeGrupos.indexOf(m.grupoId)===-1)activeGrupos.push(m.grupoId);
    var g=grupos.find(function(x){return x.id===m.grupoId;});
    if(g)reach+=g.membros||0;
  });

  document.getElementById('missionStats').innerHTML=
    '<div class="stat-card"><div class="val">'+total+'</div><div class="lbl">Total</div></div>'+
    '<div class="stat-card"><div class="val" style="color:var(--green)">'+done+'</div><div class="lbl">Concluidas</div></div>'+
    '<div class="stat-card"><div class="val" style="color:#ef6c00">'+pending+'</div><div class="lbl">Pendentes</div></div>'+
    '<div class="stat-card"><div class="val" style="color:#1565c0">'+activePerfis.length+'</div><div class="lbl">Perfis Ativos</div></div>'+
    '<div class="stat-card"><div class="val" style="color:#6a1b9a">'+activeGrupos.length+'</div><div class="lbl">Grupos</div></div>'+
    '<div class="stat-card"><div class="val" style="color:#c62828">'+(reach>=1000?(reach/1000).toFixed(1)+'k':reach)+'</div><div class="lbl">Alcance Est.</div></div>';

  var pct=total?Math.round((done/total)*100):0;
  document.getElementById('overallProgress').style.width=pct+'%';

  var byProfile={};
  missoes.forEach(function(m){
    if(!byProfile[m.perfilId])byProfile[m.perfilId]=[];
    byProfile[m.perfilId].push(m);
  });

  var html='';
  Object.keys(byProfile).forEach(function(pid){
    var profile=perfis.find(function(x){return x.id===pid;});
    var pMissoes=byProfile[pid];
    var pDone=pMissoes.filter(function(m){return m.done;}).length;

    html+='<span style="font-size:.8rem;color:#888">'+pDone+'/'+pMissoes.length+' ('+pPct+'%)</span></div>';
    html+='<div class="progress-bar"><div class="fill" style="width:'+pPct+'%"></div></div>';

    pMissoes.forEach(function(m,mi){
      var grupo=grupos.find(function(x){return x.id===m.grupoId;});
      var mIdx=missoes.findIndex(function(x){return x.id===m.id;});

      html+='<div id="'+tabId+'_1" class="tab-content">';
      if(grupo){
        html+='<p><strong>Permite links:</strong> '+(grupo.permiteLinks==='sim'?'Sim':'Nao')+'</p>';
        html+='<p><strong>Moderacao:</strong> '+esc(grupo.moderacao||'N/A')+'</p>';
        html+='<p><strong>Regras:</strong></p><div class="script-box">'+(grupo.regras?esc(grupo.regras):'Sem regras cadastradas')+'</div>';
      }else{html+='<p style="color:#999">Grupo nao encontrado</p>';}
      html+='</div>';

      html+='<div id="'+tabId+'_2" class="tab-content">';
      var whatsScript='Oi! Vi seu comentario no grupo '+(grupo?'"'+grupo.nome+'"':'')+'.\n\nVoce mencionou que esta com o nome negativado. Sabia que existe uma forma legal de resolver isso?\n\nPosso te explicar rapidinho como funciona?';
      html+='<div class="script-box">'+esc(whatsScript)+'</div>';
      html+='<button class="btn btn-secondary btn-sm" onclick="copyText(\''+escJs(whatsScript)+'\')">Copiar</button>';
      html+='</div>';

      html+='</div>';
    });
    html+='</div>';
  });

  if(!missoes.length)html='<div class="card" style="text-align:center;padding:40px;color:#999"><p>Nenhuma missao gerada.</p><p style="margin-top:8px">Cadastre perfis e grupos, depois clique em "Gerar Missoes".</p></div>';
  document.getElementById('missionList').innerHTML=html;
}

function switchMTab(prefix,idx,btn){
  for(var i=0;i<3;i++){
    var el=document.getElementById(prefix+'_'+i);
    if(el)el.classList.toggle('active',i===idx);
  }
  var tabs=btn.parentElement.querySelectorAll('button');
  tabs.forEach(function(t,ti){t.classList.toggle('active',ti===idx);});
}

function toggleMission(idx){
  missoes[idx].done=!missoes[idx].done;
  save('nle_ms',missoes);
  saveToHistory();
  renderMissoes();
}

function regenMission(idx){
  var m=missoes[idx];
  var grupo=grupos.find(function(x){return x.id===m.grupoId;});
  var allowLink=grupo?grupo.permiteLinks:'sim';
  var result=genContent(m.tipo,allowLink,config.wave||1);
  missoes[idx].conteudo=result.text;
  missoes[idx].dna=result.dna;
  save('nle_ms',missoes);
  renderMissoes();
  toast('Conteudo regenerado!');
}

/* ==================== SCRIPTS WHATSAPP ==================== */
function renderScripts(){
  var keys=Object.keys(SCRIPTS);
  var tabsHtml='';
  var contentHtml='';
  keys.forEach(function(key,ki){
    var s=SCRIPTS[key];
    tabsHtml+='<button class="'+(ki===0?'active':'')+'" onclick="switchScriptTab('+ki+',this)">'+s.title+'</button>';
    contentHtml+='<div id="script_'+ki+'" class="tab-content'+(ki===0?' active':'')+'">';
    s.variants.forEach(function(v){
      contentHtml+='<div class="card"><h4 style="font-size:.9rem;margin-bottom:8px">'+esc(v.label)+'</h4>';
      contentHtml+='<div class="script-box">'+esc(v.text)+'</div>';
      contentHtml+='<button class="btn btn-secondary btn-sm" onclick="copyText(\''+escJs(v.text)+'\')">Copiar</button>';
      contentHtml+='</div>';
    });
    contentHtml+='</div>';
  });
  document.getElementById('scriptTabs').innerHTML=tabsHtml;
  document.getElementById('scriptContent').innerHTML=contentHtml;
}

function switchScriptTab(idx,btn){
  var keys=Object.keys(SCRIPTS);
  keys.forEach(function(_,i){
    var el=document.getElementById('script_'+i);
    if(el)el.classList.toggle('active',i===idx);
  });
  btn.parentElement.querySelectorAll('button').forEach(function(b,bi){b.classList.toggle('active',bi===idx);});
}

/* ==================== GERADOR ==================== */
var lastGenResult=null;
function gerarConteudo(){
  var type=document.getElementById('genType').value;
  var wave=parseInt(document.getElementById('genWave').value);
  var noLink=document.getElementById('genNoLink').checked;
  var allowLink=noLink?'nao':'sim';
  lastGenResult=genContent(type,allowLink,wave);
  document.getElementById('genOutput').textContent=lastGenResult.text;
  var d=lastGenResult.dna;
  document.getElementById('genDna').style.display='block';
  document.getElementById('genDna').innerHTML='<strong>DNA do Conteudo:</strong> Tipo='+d.type+' | Onda='+d.wave+' | Links='+d.allowLink+' | Abertura #'+d.openingIdx+' | Corpo #'+d.body1Idx+'+#'+d.body2Idx+' | Fechamento #'+d.closingIdx;
}
function copiarGen(){
  if(!lastGenResult){toast('Gere um conteudo primeiro');return;}
  copyText(lastGenResult.text);
}

/* ==================== CONFIG ==================== */
function renderConfig(){
  document.getElementById('cfgWhats').value=config.whatsapp||'5511999999999';
  document.getElementById('cfgWave').value=config.wave||1;
  document.getElementById('cfgDay').value=config.day||1;
}

function salvarConfig(){
  config.whatsapp=document.getElementById('cfgWhats').value.trim()||'5511999999999';
  config.wave=parseInt(document.getElementById('cfgWave').value)||1;
  config.day=parseInt(document.getElementById('cfgDay').value)||1;
  save('nle_cfg',config);
  toast('Configuracoes salvas!');
}

function exportData(){
  var data={perfis:perfis,grupos:grupos,missoes:missoes,dist:dist,config:config,historico:historico};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='nle_backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('Dados exportados!');
}

function importData(event){
  var file=event.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(data.perfis)perfis=data.perfis;
      if(data.grupos)grupos=data.grupos;
      if(data.missoes)missoes=data.missoes;
      if(data.dist)dist=data.dist;
      if(data.config)config=data.config;
      if(data.historico)historico=data.historico;
      save('nle_pf',perfis);save('nle_gr',grupos);save('nle_ms',missoes);
      save('nle_dist',dist);save('nle_cfg',config);save('nle_hist',historico);
      toast('Dados importados com sucesso!');
      goTo('config');
    }catch(err){toast('Erro ao importar: arquivo invalido');}
  };
  reader.readAsText(file);
  event.target.value='';
}

function resetData(){
  if(!confirm('ATENCAO: Isso vai apagar TODOS os dados. Tem certeza?'))return;
  if(!confirm('Ultima chance: realmente deseja resetar tudo?'))return;
  perfis=[];grupos=[];missoes=[];dist=[];historico=[];
  config={whatsapp:'5511999999999',wave:1,day:1};
  save('nle_pf',perfis);save('nle_gr',grupos);save('nle_ms',missoes);
  save('nle_dist',dist);save('nle_cfg',config);save('nle_hist',historico);
  toast('Todos os dados foram resetados.');
  goTo('config');
}

/* ==================== METRICAS ==================== */
function saveToHistory(){
  var today=new Date().toISOString().slice(0,10);
  var total=missoes.length;
  var done=missoes.filter(function(m){return m.done;}).length;
  var existing=historico.findIndex(function(h){return h.date===today;});
  var entry={date:today,total:total,done:done,rate:total?Math.round((done/total)*100):0};
  if(existing>-1){historico[existing]=entry;}else{historico.push(entry);}
  save('nle_hist',historico);
}

function renderMetricas(){
  var totalPosts=0,totalDays=historico.length,totalRate=0;
  historico.forEach(function(h){totalPosts+=h.done;totalRate+=h.rate;});
  var avgRate=totalDays?Math.round(totalRate/totalDays):0;

  document.getElementById('metricStats').innerHTML=
    '<div class="stat-card"><div class="val">'+totalPosts+'</div><div class="lbl">Total Posts</div></div>'+
    '<div class="stat-card"><div class="val">'+totalDays+'</div><div class="lbl">Dias Ativos</div></div>'+
    '<div class="stat-card"><div class="val">'+avgRate+'%</div><div class="lbl">Taxa Media</div></div>';

  var last14=historico.slice(-14);
  var maxVal=1;
  last14.forEach(function(h){if(h.done>maxVal)maxVal=h.done;});
  var chartHtml='';
  if(last14.length){
    last14.forEach(function(h){
      var height=Math.max(4,Math.round((h.done/maxVal)*120));
      chartHtml+='<div class="bar" style="height:'+height+'px" title="'+h.date+': '+h.done+' posts"><span>'+h.date.slice(5)+'</span></div>';
    });
  }else{
    chartHtml='<p style="color:#999;width:100%;text-align:center;align-self:center">Sem dados ainda. Complete missoes para gerar metricas.</p>';
  }
  document.getElementById('metricChart').innerHTML=chartHtml;

  var logHtml='';
  var reversed=historico.slice().reverse();
  if(reversed.length){
    reversed.forEach(function(h){
      logHtml+='<div class="list-item"><div><strong>'+h.date+'</strong></div><div>'+h.done+'/'+h.total+' ('+h.rate+'%)</div></div>';
    });
  }else{
    logHtml='<p style="color:#999;text-align:center;padding:16px">Nenhum registro no historico.</p>';
  }
  document.getElementById('metricLog').innerHTML=logHtml;
}

/* ==================== HELPERS ==================== */
function esc(s){if(!s)return'';var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML;}
function escJs(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');}
function closeModal(id){document.getElementById(id).classList.remove('show');}

/* ==================== INIT ==================== */
buildSidebar();
goTo('missoes');
</script>
